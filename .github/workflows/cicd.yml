name: CICD Pipeline

on:
  push:
    branches: ["main"]

jobs: 

  # ============================================================
  # COMPILE
  # ============================================================
  compile:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build with Maven
        run: mvn compile


  # ============================================================
  # SECURITY CHECK
  # ============================================================
  security-check:
    runs-on: self-hosted
    needs: compile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Trivy Installation
      # --------------------------------------------------------
      - name: Install Trivy
        run: |
          if command -v trivy >/dev/null 2>&1; then
            echo "Trivy is already installed"
          else
            sudo rm -f /etc/apt/sources.list.d/trivy.list
            sudo rm -f /etc/apt/sources.list.d/trivy.sources
            sudo rm -f /usr/share/keyrings/trivy.gpg
            sudo rm -f /usr/share/keyrings/trivy-keyring.gpg

            sudo apt-get update
            sudo apt-get install -y wget gnupg lsb-release

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          fi

      - name: Verify Trivy
        run: trivy --version

      # --------------------------------------------------------
      # Trivy Filesystem Scan
      # --------------------------------------------------------
      - name: Trivy FS Scan
        run: |
          trivy fs \
            --scanners vuln \
            --format table \
            -o fs-report.txt \
            .

      # --------------------------------------------------------
      # Gitleaks Installation
      # --------------------------------------------------------
      - name: Install Gitleaks
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            echo "Gitleaks is already installed"
          else
            sudo apt-get update
            sudo apt-get install -y gitleaks
          fi

      - name: Verify Gitleaks
        run: gitleaks version

      # --------------------------------------------------------
      # Gitleaks Scan
      # --------------------------------------------------------
      - name: Gitleaks Code Scan
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json


  # ============================================================
  # UNIT TEST
  # ============================================================
  test:
    runs-on: self-hosted
    needs: security-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Unit Test Cases
        run: mvn test


  # ============================================================
  # BUILD PROJECT
  # ============================================================
  build_project_and_sonar_scan:
    runs-on: self-hosted
    needs: test

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Setup JDK 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # --------------------------------------------------------
      # Build Project
      # --------------------------------------------------------
      - name: Build Project
        run: mvn package

      # --------------------------------------------------------
      # Upload JAR Artifact
      # --------------------------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  # ============================================================
  # DOCKER BUILD AND PUSH
  # ============================================================
  build_docker_image_and_push:
    runs-on: self-hosted
    needs: build_project_and_sonar_scan

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Download JAR Artifact
      # --------------------------------------------------------
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app

      # --------------------------------------------------------
      # Verify Docker
      # --------------------------------------------------------
      - name: Verify Docker
        run: |
          whoami
          which docker
          docker --version
          docker ps

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Set up QEMU
      # --------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --------------------------------------------------------
      # Set up Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build and Push Docker Image
      # --------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: hariprasad123456/bankapp:latest


  # ============================================================
  # DEPLOY TO KUBERNETES / EKS
  # ============================================================
  deploy_to_kubernetes:
    runs-on: self-hosted
    needs: build_docker_image_and_push

    steps:

      # --------------------------------------------------------
      # Checkout Code
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Verify AWS CLI
      # --------------------------------------------------------
      # AWS CLI is already installed on the self-hosted runner.
      # Do NOT reinstall it every pipeline run.
      # --------------------------------------------------------
      - name: Verify AWS CLI
        run: |
          which aws
          aws --version

      # --------------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --------------------------------------------------------
      # Verify AWS Authentication
      # --------------------------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Set up kubectl
      # --------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # --------------------------------------------------------
      # Configure kubeconfig
      # --------------------------------------------------------
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          chmod 700 "$HOME/.kube"

          echo "${{ secrets.EKS_KUBECONFIG }}" > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

      # --------------------------------------------------------
      # Verify Kubernetes Connection
      # --------------------------------------------------------
      - name: Verify Kubernetes Connection
        run: |
          kubectl version --client
          kubectl get nodes
          kubectl get pods -A

      # --------------------------------------------------------
      # Deploy Application
      # --------------------------------------------------------
      - name: Deploy to EKS
        run: |
          kubectl apply -f ds.yml

      # --------------------------------------------------------
      # Verify Deployment
      # --------------------------------------------------------
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc

      # --------------------------------------------------------
      # Wait for Rollout
      # --------------------------------------------------------
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/bankapp --timeout=180s
